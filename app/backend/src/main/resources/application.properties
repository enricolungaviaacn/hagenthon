# Server
server.port=8080

# H2 Database (file-based, persiste tra riavvii)
spring.datasource.url=jdbc:h2:file:./data/hagenthon;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# File upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=./data/uploads

# JWT
app.jwt.secret=${JWT_SECRET:YourSuperSecretKeyForHS256ThatIsAtLeast32BytesLong!!}
app.jwt.expiration=86400000

# Mail (configura via env o .env)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:noreply@730facile.it}

# Estrazione dati: gestita internamente tramite PDFBox + pattern matching (nessuna API cloud a runtime)

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Frontend
app.frontend.url=http://localhost:5173
