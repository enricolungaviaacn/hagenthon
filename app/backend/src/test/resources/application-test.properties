# H2 in-memory per i test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT
app.jwt.secret=YourSuperSecretKeyForHS256ThatIsAtLeast32BytesLong!!
app.jwt.expiration=86400000

# Mail (stub)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=testpass
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
app.mail.from=noreply@test.com

# Anthropic
app.anthropic.api-key=sk-ant-test
app.anthropic.base-url=https://api.anthropic.com
app.anthropic.model=claude-haiku-4-5-20251001

# CORS
app.cors.allowed-origins=http://localhost:5173

# Frontend
app.frontend.url=http://localhost:5173

# Upload dir
app.upload.dir=${java.io.tmpdir}/hagenthon-test-uploads
